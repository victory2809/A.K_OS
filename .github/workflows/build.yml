name: Build Discipline APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Discipline_AK_OS_Source.zip'
      - 'ak-refresh.css'
      - 'apply_alarm_fix.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK: $SDK"
          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

      - name: Find SDK Manager
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app source ZIP
        shell: bash
        run: |
          set -e
          test -f Discipline_AK_OS_Source.zip
          mkdir -p unpacked
          unzip -q Discipline_AK_OS_Source.zip -d unpacked
          test -f unpacked/discipline_app/android/app/build.gradle

      - name: Apply refreshed graphite and lime UI
        shell: bash
        run: |
          set -e
          ASSETS="unpacked/discipline_app/android/app/src/main/assets"
          test -f "$ASSETS/index.html"
          test -f ak-refresh.css
          cp ak-refresh.css "$ASSETS/ak-refresh.css"
          if ! grep -q 'ak-refresh.css' "$ASSETS/index.html"; then
            sed -i 's#</head>#<link rel="stylesheet" href="ak-refresh.css"></head>#' "$ASSETS/index.html"
          fi
          cp "$ASSETS/index.html" unpacked/discipline_app/index.html
          echo "UI stylesheet applied:"
          wc -c "$ASSETS/ak-refresh.css"

      - name: Apply continuous alarm sound fix
        run: python3 apply_alarm_fix.py

      - name: Build APK
        working-directory: unpacked/discipline_app/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="unpacked/discipline_app/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Discipline-debug-APK
          path: unpacked/discipline_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
