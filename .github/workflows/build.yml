name: Build Discipline APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"
          test -d "$SDK"

      - name: Locate SDK Manager
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android SDK Manager not found."
            find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract app source ZIP
        shell: bash
        run: |
          set -e
          test -f Discipline_AK_OS_Source.zip
          unzip -q Discipline_AK_OS_Source.zip -d unpacked
          test -f unpacked/discipline_app/android/app/build.gradle

      - name: Build debug APK
        working-directory: unpacked/discipline_app/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discipline-debug-APK
          path: unpacked/discipline_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
